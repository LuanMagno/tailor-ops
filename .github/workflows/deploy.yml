name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gas-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Clasp Push & Update Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication and project ID
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Secrets CLASPRC_JSON e SCRIPT_ID devem estar configurados no repositório."
            exit 1
          fi
          printf '%s\n' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(".clasp.json", JSON.stringify({
              scriptId: process.env.SCRIPT_ID.trim(),
              rootDir: "./src"
            }, null, 2));
          '

      - name: Push files to Apps Script
        run: npx clasp push --force

      - name: Update fixed Web App deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Secret DEPLOYMENT_ID deve estar configurado no repositório."
            exit 1
          fi
          npx clasp deploy -i "$DEPLOYMENT_ID" -d "Deploy $COMMIT_SHA"

      - name: Shred temporary credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
